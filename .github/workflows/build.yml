#
# Multi-arch build of tailcat + luci-app-tailcat ipk.
#
# Runs inside the official OpenWrt SDK container. Per the OpenWrt
# docker repo, the SDK image's WORKDIR is /builder/ and a setup.sh
# script must be run first to unpack the SDK tarball for that target.
#
# Flow per arch:
#   1. docker run, mount repo read-only at /pkg
#   2. ./setup.sh  (unpacks SDK into /builder/openwrt-sdk-*)
#   3. cd into the unpacked SDK dir
#   4. symlink our packages into package/ and feeds/luci/applications/
#   5. ./scripts/feeds update -a && ./scripts/feeds install -a
#   6. make defconfig with both packages enabled
#   7. compile both packages
#   8. copy resulting .ipk out to the host

name: Build ipk

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.tag }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # SDK image tags are plain arch/target names.
        tag: [x86_64, aarch64_cortex-a76]

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /usr/lib/firefox /usr/lib/jvm \
                      /usr/lib/rustlib 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Pull OpenWrt SDK
        run: |
          docker pull openwrt/sdk:${{ matrix.tag }}
          df -h /

      - name: Build packages
        run: |
          set -eux
          # Mount the repo read-only at /pkg so the SDK can symlink
          # our packages into its tree.
          docker run --rm \
            -v "$PWD:/pkg:ro" \
            openwrt/sdk:${{ matrix.tag }} \
            /bin/bash -c '
              set -eux
              cd /builder

              # Unpack the SDK for this target.
              ./setup.sh

              # Find the unpacked SDK directory.
              SDK_DIR=$(find /builder -maxdepth 1 -type d -name "openwrt-sdk-*" | head -1)
              if [ -z "$SDK_DIR" ]; then
                echo "ERROR: could not find unpacked SDK dir under /builder"
                ls -la /builder
                exit 1
              fi
              echo "SDK dir: $SDK_DIR"
              cd "$SDK_DIR"

              # Symlink our packages into the tree.
              ln -sf /pkg/tailcat package/tailcat

              # luci-app-tailcat needs the luci feed; refresh feeds first.
              ./scripts/feeds update -a
              ./scripts/feeds install luci

              # Place luci-app-tailcat into the luci feed applications dir.
              mkdir -p feeds/luci/applications
              ln -sf /pkg/luci-app-tailcat feeds/luci/applications/luci-app-tailcat

              # Install both packages via feeds.
              ./scripts/feeds install tailcat luci-app-tailcat || true

              # Enable both packages in .config, then expand.
              echo "CONFIG_PACKAGE_tailcat=y" >> .config
              echo "CONFIG_PACKAGE_luci-app-tailcat=y" >> .config
              make defconfig

              # Compile tailcat (Go-based, may take a while).
              make -j"$(nproc)" package/tailcat/compile V=s || \
                make -j1 package/tailcat/compile V=s

              # Compile luci-app-tailcat.
              make -j"$(nproc)" package/feeds/luci/luci-app-tailcat/compile V=s || \
                make -j1 package/feeds/luci/luci-app-tailcat/compile V=s
            '

      - name: Collect built ipk
        run: |
          set -eux
          mkdir -p artifacts
          docker run --rm \
            -v "$PWD/artifacts:/out" \
            openwrt/sdk:${{ matrix.tag }} \
            /bin/bash -c '
              set -eux
              SDK_DIR=$(find /builder -maxdepth 1 -type d -name "openwrt-sdk-*" | head -1)
              cd "$SDK_DIR"
              find bin -name "tailcat*.ipk" -exec cp {} /out/ \;
              find bin -name "luci-app-tailcat*.ipk" -exec cp {} /out/ \;
            '
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ matrix.tag }}
          path: artifacts/*.ipk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach ipk to snapshot release
    needs: build
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Show collected ipk
        run: ls -la all-artifacts/

      - name: Create snapshot release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot-${{ github.sha }}
          name: Snapshot build ${{ github.sha }}
          body: |
            Automated build from commit ${{ github.sha }}.
            Built against OpenWrt SDK (target tags in artifact names).
          files: all-artifacts/*.ipk
          prerelease: true

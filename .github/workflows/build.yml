#
# Build tailcat + luci-app-tailcat ipk.
#
# Strategy (simple, no OpenWrt SDK / Go toolchain needed):
#   1. Download prebuilt tailcat binaries from the official
#      tailscale/tailcat GitHub Releases (linux amd64/arm64/armv7).
#   2. Assemble an ipk package tree using our files/ layout.
#   3. Pack with opkg-utils `ipkg-build`.
#
# luci-app-tailcat is pure Lua/JS + config, so it is packed the
# same way (no cross-compilation required).
#

name: Build ipk

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  TAILCAT_VERSION: "0.5.0"

jobs:
  build-tailcat:
    name: tailcat ipk for ${{ matrix.goarch }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # goarch  →  opkg arch mapping
        include:
          - goarch: amd64
            opkg_arch: x86_64
          - goarch: arm64
            opkg_arch: aarch64_cortexa53
          - goarch: armv7
            opkg_arch: arm_cortex-a7_neon-vfpv4

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install opkg-utils
        run: |
          set -eux
          # opkg-utils is not in Ubuntu 22.04 apt; install from source.
          git clone --depth 1 https://git.yoctoproject.org/opkg-utils /tmp/opkg-utils
          # Makefile hardcodes /usr/local; install there and add to PATH.
          sudo make -C /tmp/opkg-utils install
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          which opkg-build
          ls /usr/local/bin/opkg*

      - name: Download tailcat binary
        run: |
          set -eux
          mkdir -p dl
          curl -fsSL \
            "https://github.com/tailscale/tailcat/releases/download/v${TAILCAT_VERSION}/tailcat_${TAILCAT_VERSION}_linux_${{ matrix.goarch }}.tar.gz" \
            -o dl/tailcat.tar.gz
          tar -xzf dl/tailcat.tar.gz -C dl
          find dl -type f -name 'tailcat' -o -name 'tailcat_*'
          # Locate the tailcat binary (inside a dir or at root).
          BIN=$(find dl -type f -name 'tailcat' | head -1)
          [ -n "$BIN" ] || BIN=$(find dl -type f -name 'tailcat_*' | head -1)
          [ -n "$BIN" ] || { echo "tailcat binary not found"; exit 1; }
          chmod +x "$BIN"
          echo "TAILCAT_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Assemble package tree
        run: |
          set -eux
          PKGROOT="pkg-root"
          mkdir -p "$PKGROOT/usr/bin"
          cp "$TAILCAT_BIN" "$PKGROOT/usr/bin/tailcat"
          chmod 0755 "$PKGROOT/usr/bin/tailcat"

          # init script, UCI config, instance helper
          mkdir -p "$PKGROOT/etc/init.d"
          cp tailcat/files/etc/init.d/tailcat "$PKGROOT/etc/init.d/tailcat"
          chmod 0755 "$PKGROOT/etc/init.d/tailcat"

          mkdir -p "$PKGROOT/etc/config"
          cp tailcat/files/etc/config/tailcat "$PKGROOT/etc/config/tailcat"

          mkdir -p "$PKGROOT/usr/lib/tailcat"
          cp tailcat/files/usr/lib/tailcat/tailcat-instance.sh \
             "$PKGROOT/usr/lib/tailcat/tailcat-instance.sh"
          chmod 0755 "$PKGROOT/usr/lib/tailcat/tailcat-instance.sh"

          # CONTROL directory with metadata for ipkg-build
          mkdir -p "$PKGROOT/CONTROL"
          cat > "$PKGROOT/CONTROL/control" <<EOF
          Package: tailcat
          Version: ${TAILCAT_VERSION}-1
          Architecture: ${{ matrix.opkg_arch }}
          Maintainer: OpenWrt-Tailcat Contributors
          Section: net
          Priority: optional
          Depends: ca-bundle
          Description: Tailcat - netcat over Tailscale's data plane.
           Point-to-point WireGuard-encrypted tunnels between two
           machines with DERP as the NAT-hole-punching side channel.
           No account, no root, userspace only.
          Source: https://github.com/tailscale/tailcat
          EOF
          # conffiles
          echo "/etc/config/tailcat" > "$PKGROOT/CONTROL/conffiles"
          # postinst to enable service
          cat > "$PKGROOT/CONTROL/postinst" <<'EOF'
          #!/bin/sh
          [ -n "$IPKG_INSTROOT" ] && exit 0
          /etc/init.d/tailcat enable 2>/dev/null || true
          exit 0
          EOF
          chmod 0755 "$PKGROOT/CONTROL/postinst"

      - name: Build ipk
        run: |
          set -eux
          mkdir -p out
          # Hand-build an OpenWrt-compatible ipk (gzip-tar, not ar).
          # Layout: debian-binary + control.tar.gz + data.tar.gz,
          # outer container is gzip-compressed tar.
          WORK="$PWD"
          PKG="$WORK/pkg-root"

          # 1. debian-binary (version line)
          printf '2.0\n' > "$WORK/debian-binary"

          # 2. control.tar.gz from CONTROL/
          ( cd "$PKG/CONTROL" && tar czf "$WORK/control.tar.gz" . )

          # 3. data.tar.gz from package tree (excluding CONTROL/)
          ( cd "$PKG" && tar czf "$WORK/data.tar.gz" \
              --exclude='./CONTROL' --exclude='./CONTROL/*' . )

          # 4. assemble ipk: gzip-compressed tar of the 3 files
          IPK="$WORK/out/tailcat_${TAILCAT_VERSION}-1_${{ matrix.opkg_arch }}.ipk"
          tar czf "$IPK" -C "$WORK" ./debian-binary ./control.tar.gz ./data.tar.gz
          ls -la out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tailcat-${{ matrix.opkg_arch }}
          path: out/*.ipk
          if-no-files-found: error
          retention-days: 30

  build-luci:
    name: luci-app-tailcat ipk
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install opkg-utils
        run: |
          set -eux
          # opkg-utils is not in Ubuntu 22.04 apt; install from source.
          git clone --depth 1 https://git.yoctoproject.org/opkg-utils /tmp/opkg-utils
          sudo make -C /tmp/opkg-utils install
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          which opkg-build
          ls /usr/local/bin/opkg*

      - name: Assemble package tree
        run: |
          set -eux
          PKGROOT="pkg-root"
          mkdir -p "$PKGROOT"

          # Views (LuCI JS modules)
          mkdir -p "$PKGROOT/www/luci-static/resources/view/tailcat"
          cp luci-app-tailcat/src/root/usr/share/luci/view/tailcat/*.js \
             "$PKGROOT/www/luci-static/resources/view/tailcat/"

          # Controller
          mkdir -p "$PKGROOT/usr/share/luci/controller"
          cp -r luci-app-tailcat/src/root/usr/share/luci/controller/tailcat.js \
             "$PKGROOT/usr/share/luci/controller/"

          # Menu registration
          mkdir -p "$PKGROOT/usr/share/luci/menu.d"
          cp luci-app-tailcat/src/usr/share/luci/menu.d/*.json \
             "$PKGROOT/usr/share/luci/menu.d/"

          # rpcd ACL
          mkdir -p "$PKGROOT/usr/share/rpcd/acl.d"
          cp luci-app-tailcat/src/usr/share/rpcd/acl.d/*.json \
             "$PKGROOT/usr/share/rpcd/acl.d/"

          # i18n
          mkdir -p "$PKGROOT/usr/share/luci/i18n"
          cp luci-app-tailcat/po/en/*.po "$PKGROOT/usr/share/luci/i18n/" 2>/dev/null || true
          cp luci-app-tailcat/po/zh-cn/*.po "$PKGROOT/usr/share/luci/i18n/" 2>/dev/null || true

          # CONTROL
          mkdir -p "$PKGROOT/CONTROL"
          cat > "$PKGROOT/CONTROL/control" <<EOF
          Package: luci-app-tailcat
          Version: 0.1.0-1
          Architecture: all
          Maintainer: OpenWrt-Tailcat Contributors
          Section: luci
          Priority: optional
          Depends: tailcat
          Description: LuCI interface for the tailcat service.
           Create local tailcat services (serve local ports, SSH,
           file drop box) and forward remote tailcat services to
           local ports, all through the web UI.
          EOF
          cat > "$PKGROOT/CONTROL/postinst" <<'EOF'
          #!/bin/sh
          [ -n "$IPKG_INSTROOT" ] && exit 0
          killall -HUP rpcd 2>/dev/null || true
          rm -f /var/luci-indexcache 2>/dev/null || true
          exit 0
          EOF
          chmod 0755 "$PKGROOT/CONTROL/postinst"

      - name: Build ipk
        run: |
          set -eux
          mkdir -p out
          # Hand-build an OpenWrt-compatible ipk (gzip-tar, not ar).
          WORK="$PWD"
          PKG="$WORK/pkg-root"
          printf '2.0\n' > "$WORK/debian-binary"
          ( cd "$PKG/CONTROL" && tar czf "$WORK/control.tar.gz" . )
          ( cd "$PKG" && tar czf "$WORK/data.tar.gz" \
              --exclude='./CONTROL' --exclude='./CONTROL/*' . )
          IPK="$WORK/out/luci-app-tailcat_0.1.0-1_all.ipk"
          tar czf "$IPK" -C "$WORK" ./debian-binary ./control.tar.gz ./data.tar.gz
          ls -la out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-tailcat
          path: out/*.ipk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach ipk to snapshot release
    needs: [build-tailcat, build-luci]
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Show collected ipk
        run: ls -la all-artifacts/

      - name: Create snapshot release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot-${{ github.sha }}
          name: Snapshot build ${{ github.sha }}
          body: |
            Automated build from commit ${{ github.sha }}.
            tailcat v${{ env.TAILCAT_VERSION }} prebuilt binaries
            repackaged as OpenWrt ipk.
          files: all-artifacts/*.ipk
          prerelease: true

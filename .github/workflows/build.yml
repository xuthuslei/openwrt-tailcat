#
# Multi-arch build of tailcat + luci-app-tailcat ipk.
#
# Runs inside the official OpenWrt SDK container (tag = arch name,
# e.g. openwrt/sdk:x86_64). The SDK image is ~350 MB and ships a
# pre-configured OpenWrt tree at /home/build/openwrt with a .config
# already set for that target.
#
# We mount our repo into the container, symlink our two packages into
# the tree at the paths their Makefiles expect, refresh feeds so
# luci.mk / golang-package.mk are available, then compile.
#

name: Build ipk

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.tag }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # SDK image tags are plain arch names.
        tag: [x86_64, aarch64_cortex-a76]

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /usr/lib/firefox /usr/lib/jvm \
                      /usr/lib/rustlib 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Pull OpenWrt SDK
        run: |
          docker pull openwrt/sdk:${{ matrix.tag }}
          df -h /

      - name: Build packages
        run: |
          set -eux
          # Single docker run: mount the repo read-only at /pkg,
          # symlink packages into the SDK tree, refresh feeds,
          # enable both packages in .config, and compile.
          docker run --rm \
            -v "$PWD:/pkg:ro" \
            -e TARGET_TAG=${{ matrix.tag }} \
            openwrt/sdk:${{ matrix.tag }} \
            /bin/bash -c '
              set -eux
              cd /home/build/openwrt

              # Symlink our packages into the tree.
              ln -sf /pkg/tailcat package/tailcat

              # luci-app-tailcat needs the luci feed; refresh feeds first.
              ./scripts/feeds update -a
              ./scripts/feeds install luci

              # Now we can place luci-app-tailcat into feeds/luci/applications.
              ln -sf /pkg/luci-app-tailcat feeds/luci/applications/luci-app-tailcat

              # Re-run feeds install to pick up luci-app-tailcat.
              ./scripts/feeds install luci-app-tailcat

              # Enable both packages in .config, then expand.
              ./scripts/feeds install tailcat luci-app-tailcat || true
              echo "CONFIG_PACKAGE_tailcat=y" >> .config
              echo "CONFIG_PACKAGE_luci-app-tailcat=y" >> .config
              make defconfig

              # Compile tailcat (Go-based, may take a while).
              make -j"$(nproc)" package/tailcat/compile V=s || \
                make -j1 package/tailcat/compile V=s

              # Compile luci-app-tailcat.
              make -j"$(nproc)" package/feeds/luci/luci-app-tailcat/compile V=s || \
                make -j1 package/feeds/luci/luci-app-tailcat/compile V=s
            '

      - name: Collect built ipk
        run: |
          set -eux
          mkdir -p artifacts
          docker run --rm \
            -v "$PWD/artifacts:/out" \
            openwrt/sdk:${{ matrix.tag }} \
            /bin/bash -c '
              set -eux
              cd /home/build/openwrt
              find bin -name "tailcat*.ipk" -exec cp {} /out/ \;
              find bin -name "luci-app-tailcat*.ipk" -exec cp {} /out/ \;
            '
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ matrix.tag }}
          path: artifacts/*.ipk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach ipk to snapshot release
    needs: build
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Show collected ipk
        run: ls -la all-artifacts/

      - name: Create snapshot release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot-${{ github.sha }}
          name: Snapshot build ${{ github.sha }}
          body: |
            Automated build from commit ${{ github.sha }}.
            Built against OpenWrt SDK (target tags in artifact names).
          files: all-artifacts/*.ipk
          prerelease: true
